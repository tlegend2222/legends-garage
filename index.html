<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legends Garage • Prairie Goddess Prompt Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 40px; max-width: 900px; margin: auto; }
  h1 { color: #ff4d4d; }
  button { background: #ff4d4d; color: white; border: none; padding: 12px 20px; margin: 8px; border-radius: 6px; cursor: pointer; font-size: 16px; }
  button:hover { background: #cc0000; }
  textarea { width: 100%; height: 200px; background: #222; color: #eee; border: 1px solid #444; padding: 15px; font-size: 15px; border-radius: 8px; }
  .section { margin: 30px 0; }
</style>
</head>
<body>
<h1>Legends Garage • Prairie Goddess</h1>
<p>Click to build fire prompts featuring this farm beauty. Copy & paste into me or any image tool.</p>

<div class="section">
  <h2>Outfit & Pose</h2>
  <button onclick="addToPrompt('blonde woman in pink gingham crop top tied at waist, deep cleavage, white lace bra')">Pink Gingham Crop + Cleavage</button>
  <button onclick="addToPrompt('straw cowboy hat with turquoise, long blonde hair blowing in wind')">Cowboy Hat & Windblown Hair</button>
  <button onclick="addToPrompt('faded blue jeans, tooled leather belt, hand on hip, confident pose')">Jeans & Leather Belt Pose</button>
  <button onclick="addToPrompt('holding green John Deere cap, border collie at her side')">John Deere Cap + Dog</button>
</div>

<div class="section">
  <h2>Setting & Vibe</h2>
  <button onclick="addToPrompt('golden hour prairie sunset, grain bins, red grain cart, green tractor in background')">Prairie Golden Hour</button>
  <button onclick="addToPrompt('farm field, wind in hair, seductive confident smile, photorealistic skin texture')">Seductive Farm Smile</button>
  <button onclick="addToPrompt('hyper-detailed, 8k, realistic lighting, windblown hair, perfect skin')">Photorealistic 8K</button>
</div>

<div class="section">
  <h2>Full Prompt</h2>
  <textarea id="promptBox" placeholder="Your generated prompt will appear here..."></textarea>
  <button onclick="copyPrompt()">Copy Prompt</button>
  <button onclick="clearPrompt()">Clear</button>
</div>

<script>
let promptText = '';

function addToPrompt(text) {
  if (promptText) promptText += ', ';
  promptText += text;
  document.getElementById('promptBox').value = promptText;
}

function copyPrompt() {
  const textarea = document.getElementById('promptBox');
  textarea.select();
  document.execCommand('copy');
  alert('Prompt copied! Paste into Grok or your image tool.');
}

function clearPrompt() {
  promptText = '';
  document.getElementById('promptBox').value = '';
}
</script>
</body>
</html>
