<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legends Garage • Prompt Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 40px; max-width: 900px; margin: auto; }
  h1 { color: #ff4d4d; }
  button { background: #ff4d4d; color: white; border: none; padding: 12px 20px; margin: 8px; border-radius: 6px; cursor: pointer; font-size: 16px; }
  button:hover { background: #cc0000; }
  textarea { width: 100%; height: 180px; background: #222; color: #eee; border: 1px solid #444; padding: 15px; font-size: 15px; border-radius: 8px; }
  .section { margin: 30px 0; }
</style>
</head>
<body>
<h1>Legends Garage Prompt Generator</h1>
<p>Click buttons to build perfect prompts for Scarlet-style trucks or custom builds. Copy and paste into Grok or any image tool.</p>

<div class="section">
  <h2>Base Vehicle</h2>
  <button onclick="addToPrompt('1995 Silverado Extended Cab')">1995 Silverado Ext Cab</button>
  <button onclick="addToPrompt('Custom 1995 Silverado TBI 5.7L')">TBI 5.7L Silverado</button>
  <button onclick="addToPrompt('Heavy wrecker / rollback conversion')">Wrecker / Rollback</button>
</div>

<div class="section">
  <h2>Style & Details</h2>
  <button onclick="addToPrompt('jet black glossy paint, blacked-out windows')">Blacked-out Black</button>
  <button onclick="addToPrompt('chrome grille, 15-inch SS rims')">Chrome + 15" SS Rims</button>
  <button onclick="addToPrompt('bright red leather interior, custom multicolored LED gauges')">Red Interior + LEDs</button>
  <button onclick="addToPrompt('dual straight-pipe exhaust, aggressive stance')">Loud Dual Pipes</button>
  <button onclick="addToPrompt('moon visor, clear lenses, Lund tonneau cover')">Accessories</button>
</div>

<div class="section">
  <h2>Lighting & Mood</h2>
  <button onclick="addToPrompt('golden hour dusk, prairie background, cinematic lighting')">Golden Hour Cinematic</button>
  <button onclick="addToPrompt('night shot, custom underglow + accent LEDs glowing')">Night Glow</button>
  <button onclick="addToPrompt('photorealistic, hyper-detailed, 8k, skin-like paint reflections')">Photorealistic 8K</button>
</div>

<div class="section">
  <h2>Full Prompt</h2>
  <textarea id="promptBox" placeholder="Your generated prompt will appear here..."></textarea>
  <button onclick="copyPrompt()">Copy Prompt</button>
  <button onclick="clearPrompt()">Clear</button>
</div>

<script>
let promptText = '';

function addToPrompt(text) {
  if (promptText) promptText += ', ';
  promptText += text;
  document.getElementById('promptBox').value = promptText;
}

function copyPrompt() {
  const textarea = document.getElementById('promptBox');
  textarea.select();
  document.execCommand('copy');
  alert('Prompt copied! Paste it into Grok or your image tool.');
}

function clearPrompt() {
  promptText = '';
  document.getElementById('promptBox').value = '';
}
</script>
</body>
</html>
